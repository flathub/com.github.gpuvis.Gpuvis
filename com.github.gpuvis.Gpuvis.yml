  "app-id": "com.github.gpuvis.Gpuvis"
  "runtime": "org.freedesktop.Platform"
  "runtime-version": "25.08"
  "sdk": "org.freedesktop.Sdk"
  "command": "gpuvis"
  finish-args:
    # X11 + XShm access
    - --share=ipc
    - --socket=fallback-x11
    # Wayland access
    - --socket=wayland
    # Needs to talk to the network:
    - --share=network
    # Needs to save files locally
    - --filesystem=xdg-documents
    # OpenGL rendering
    - --device=dri
  cleanup:
    - /include
    - /lib/cmake
    - /lib/pkgconfig
    - /share/doc
  modules:
    - name: rapidjson
      buildsystem: cmake
      config-opts:
        - -DRAPIDJSON_BUILD_DOC=OFF
        - -DRAPIDJSON_BUILD_EXAMPLES=OFF
        - -DRAPIDJSON_BUILD_TESTS=OFF

      sources:
        - type: git
          url: https://github.com/Tencent/rapidjson.git
          # The latest commit from the repository
          commit: 24b5e7a8b27f42fa16b96fc70aade9106cf7102f

    - name: gpuvis
      buildsystem: meson
      post-install:
        - install -Dm644 --target-directory=${FLATPAK_DEST}/share/metainfo ../${FLATPAK_ID}.metainfo.xml
        - install -Dm644 --target-directory=${FLATPAK_DEST}/share/applications ../${FLATPAK_ID}.desktop
        - install -Dm644 --target-directory=${FLATPAK_DEST}/share/icons/hicolor/scalable/apps ../${FLATPAK_ID}.svg
      sources:
        - type: git
          url: https://github.com/mikesart/gpuvis.git
          tag: 'v0.2'
          commit: fe3d30268eedee65fdbfc06275d0762fd743c469
        - type: patch
          path: fix-appdata.patch
